# League Layer's Worker (see index.js and README.md). Deploy from this folder: npx wrangler deploy
name = "leaguelayer-yahoo"
main = "index.js"
compatibility_date = "2026-10-01"

# served at api.leaguelayer.com (the domain is already on Cloudflare)
routes = [{ pattern = "api.leaguelayer.com", custom_domain = true }]

[vars]
# the pages allowed to use it: the site, and the local previews (5173, and 5174-5179 for sessions working in worktrees)
SITE_ORIGINS = "https://leaguelayer.com,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179"

# YAHOO_CLIENT_ID and YAHOO_CLIENT_SECRET are secrets: npx wrangler secret put YAHOO_CLIENT_ID (and _SECRET)

# The site's error log (see README.md), made with  npx wrangler kv namespace create ERRORS
# The log page's password is a secret:  npx wrangler secret put ERRORS_KEY
[[kv_namespaces]]
binding = "ERRORS"
id = "6237323107d847fa897250456b62c0df"

# The daily data job, started on time (index.js, startDataJob; README.md "Daily data job"): 08:00 UTC every day.
# Its GitHub token is a secret:  npx wrangler secret put GITHUB_TOKEN
[triggers]
crons = ["0 8 * * *"]

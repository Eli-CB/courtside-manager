<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courtside Manager</title>
  <meta name="description" content="Manage your fantasy basketball roster, lineup, matchups and trades.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23f97316'/><path d='M4 50h92M50 4v92M18 18c18 18 18 46 0 64M82 18c-18 18-18 46 0 64' stroke='%23161a22' stroke-width='5' fill='none'/></svg>">
  <!-- ?v= is stamped with each deploy's version, so a refresh always fetches the new files -->
  <link rel="stylesheet" href="styles.css?v=__BUILD__">
</head>
<body>
  <div id="ctxBar" class="ctx" hidden>
    <div class="ctx-inner">
      <div class="ctx-row"><div id="leagueMenu"></div><span class="ctx-sep" aria-hidden="true">/</span><span class="ctx-team-wrap" id="ctxTeam"></span></div>
      <div class="ctx-meta" id="ctxMeta"></div>
    </div>
  </div>
  <header class="topbar">
    <div class="topbar-inner">
      <!-- phones: the sections collapse into this menu button -->
      <button type="button" class="nav-btn" data-action="nav-toggle" aria-expanded="false" aria-controls="tabs"><span class="nav-icon" aria-hidden="true">☰</span><span id="navCurrent">Menu</span></button>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <div class="top-right" id="gearMenu"></div>
    </div>
  </header>

  <main id="view" class="container" tabindex="-1"></main>

  <dialog id="detailDialog" class="modal modal-lg">
    <div class="modal-head">
      <span class="muted small">Player card</span>
      <button type="button" class="icon-btn" data-action="close-detail" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot" id="detailFoot"></div>
  </dialog>

  <dialog id="infoDialog" class="modal info-modal" aria-labelledby="infoTitle">
    <div class="modal-head">
      <h2 id="infoTitle">How this works</h2>
      <button type="button" class="icon-btn" data-action="close-info" aria-label="Close">✕</button>
    </div>
    <div class="modal-body prose" id="infoBody"></div>
  </dialog>

  <dialog id="confirmDialog" class="modal modal-sm">
    <form method="dialog">
      <div class="modal-body">
        <h2 id="confirmTitle">Are you sure?</h2>
        <p id="confirmBody" class="muted"></p>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" value="cancel">Cancel</button>
        <button class="btn primary" value="ok" id="confirmOk">Confirm</button>
      </div>
    </form>
  </dialog>

  <dialog id="backupDialog" class="modal">
    <div class="modal-head">
      <h2>Backup &amp; restore</h2>
      <button type="button" class="icon-btn" data-action="close-backup" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <p class="muted small" style="margin-top:0">Copy this text and keep it somewhere safe. To restore, paste a backup here and choose Restore.</p>
      <label class="field" for="backupText">Backup data<textarea id="backupText" rows="8" spellcheck="false"></textarea></label>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn ghost" data-action="restore-backup">Restore from this text</button>
      <button type="button" class="btn primary" data-action="copy-backup">Copy backup</button>
    </div>
  </dialog>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>

  <!-- one script, split into files that share a scope: keep this order -->
  <script src="js/core.js?v=__BUILD__"></script>
  <script src="js/nba.js?v=__BUILD__"></script>
  <script src="js/info.js?v=__BUILD__"></script>
  <script src="js/fantrax.js?v=__BUILD__"></script>
  <script src="js/render.js?v=__BUILD__"></script>
  <script src="js/history.js?v=__BUILD__"></script>
  <script src="js/views.js?v=__BUILD__"></script>
  <script src="js/matchups.js?v=__BUILD__"></script>
  <script src="js/draft.js?v=__BUILD__"></script>
  <script src="js/actions.js?v=__BUILD__"></script>
</body>
</html>

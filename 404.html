<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · League Layer</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages answers any address that doesn't exist with this page (status 404). Everything is inline or
       addressed from the site's root, since it can show up at any depth (/players, /a/b/c). -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='6 9.5 52 52'><style>.a{fill:%23161a22}@media (prefers-color-scheme:dark){.a{fill:%23ffffff}}</style><polygon class='a' points='36,37 56,27 46,22 36,27 18,18 8,23'/><polygon fill='%237f8a9c' points='8,31 36,45 56,35 56,43 36,53 8,39'/></svg>">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/inter-latin.woff2) format('woff2'); }
    :root { --bg: #fafafa; --surface: #ffffff; --surface-2: #f4f4f5; --border: #e4e4e7; --text: #09090b; --muted: #71717a; --accent: #e8620c; --mark: #161a22; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #09090b; --surface: #141416; --surface-2: #202024; --border: #2c2c31; --text: #fafafa; --muted: #a1a1aa; --accent: #f97316; --mark: #ffffff; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { width: 100%; max-width: 440px; text-align: center; }
    .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 700; margin-bottom: 28px; }
    .brand svg { width: 26px; height: 26px; }
    /* his jersey, from the back: a road jersey of the team that drafted him (Philadelphia, 2015), in its colors only */
    .jersey { width: 184px; margin: 0 auto 18px; }
    .jersey svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 6px 10px rgb(0 0 0 / .18)); }
    .jersey text { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; paint-order: stroke; stroke-linejoin: round; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } /* (for screen readers: the jersey says it) */
    h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.01em; }
    p { margin: 0 0 6px; color: var(--muted); }
    .where { font-size: .85rem; overflow-wrap: anywhere; }
    .where code { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
    .btn { font: inherit; font-weight: 500; font-size: .9rem; text-decoration: none; border: 1px solid var(--border); background: var(--surface);
      color: var(--text); padding: 8px 16px; border-radius: 6px; }
    .btn:hover { background: var(--surface-2); }
    .btn.primary { background: var(--text); border-color: var(--text); color: var(--surface); }
    .btn.primary:hover { opacity: .9; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="League Layer home">
      <svg viewBox="6 9.5 52 52" aria-hidden="true"><polygon fill="var(--mark)" points="36,37 56,27 46,22 36,27 18,18 8,23"/><polygon fill="#7f8a9c" points="8,31 36,45 56,35 56,43 36,53 8,39"/></svg>
      League Layer
    </a>
    <!-- Jahlil Okafor-o-four: his jersey from the back says it all -->
    <div class="jersey" role="img" aria-label="The back of a blue basketball jersey: OKAFOR, number 04">
      <svg viewBox="0 0 200 224" aria-hidden="true">
        <defs>
          <!-- the fabric: lighter down the middle, darker at the sides, and a fine mesh -->
          <linearGradient id="cloth" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#004f8a"/><stop offset=".22" stop-color="#0063a8"/><stop offset=".5" stop-color="#0a72bf"/>
            <stop offset=".78" stop-color="#0063a8"/><stop offset="1" stop-color="#004f8a"/>
          </linearGradient>
          <linearGradient id="fold" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".18" stop-color="#000" stop-opacity="0"/>
            <stop offset=".85" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/>
          </linearGradient>
          <pattern id="mesh" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#ffffff" fill-opacity=".09"/></pattern>
          <clipPath id="body"><path id="shape" d="M60 6 Q100 24 140 6 L163 8 C163 40 172 62 190 70 L186 214 Q100 222 14 214 L10 70 C28 62 37 40 37 8 Z"/></clipPath>
          <path id="arc" d="M50 66 Q100 46 150 66"/>
        </defs>
        <g clip-path="url(#body)">
          <rect width="200" height="224" fill="url(#cloth)"/>
          <rect width="200" height="224" fill="url(#mesh)"/>
          <rect width="200" height="224" fill="url(#fold)"/>
          <!-- side panels: red, edged in white -->
          <path d="M190 70 L186 214" stroke="#ffffff" stroke-width="14"/>
          <path d="M190 70 L186 214" stroke="#ed174c" stroke-width="9"/>
          <path d="M10 70 L14 214" stroke="#ffffff" stroke-width="14"/>
          <path d="M10 70 L14 214" stroke="#ed174c" stroke-width="9"/>
          <!-- a soft crease down the back -->
          <path d="M100 30 C96 90 104 150 98 214" stroke="#000" stroke-opacity=".07" stroke-width="10" fill="none"/>
          <path d="M14 206 Q100 214 186 206" stroke="#000" stroke-opacity=".12" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
        </g>
        <!-- trim: the collar and armholes, red with white edges -->
        <g fill="none" stroke-linecap="round">
          <path d="M60 6 Q100 24 140 6" stroke="#ffffff" stroke-width="7"/>
          <path d="M60 6 Q100 24 140 6" stroke="#ed174c" stroke-width="3.5"/>
          <path d="M163 8 C163 40 172 62 190 70" stroke="#ffffff" stroke-width="7"/>
          <path d="M163 8 C163 40 172 62 190 70" stroke="#ed174c" stroke-width="3.5"/>
          <path d="M37 8 C37 40 28 62 10 70" stroke="#ffffff" stroke-width="7"/>
          <path d="M37 8 C37 40 28 62 10 70" stroke="#ed174c" stroke-width="3.5"/>
          <path d="M37 8 L60 6 M140 6 L163 8" stroke="#ffffff" stroke-width="3"/>
        </g>
        <!-- OKAFOR, arched, over 04: white, outlined in red -->
        <text font-size="17" letter-spacing="3" fill="#ffffff" stroke="#ed174c" stroke-width="3" text-anchor="middle"><textPath href="#arc" startOffset="50%">OKAFOR</textPath></text>
        <text x="100" y="152" font-size="84" letter-spacing="-3" fill="#ffffff" stroke="#ed174c" stroke-width="6" text-anchor="middle">04</text>
      </svg>
    </div>
    <h1 class="sr-only">Page not found</h1>
    <p>This page isn't on the roster. It may have been waived, traded away, or never drafted at all.</p>
    <p class="where" id="where" hidden>Nothing lives at <code id="path"></code></p>
    <div class="actions">
      <a class="btn primary" href="/">Back to League Layer</a>
      <a class="btn" href="/#dashboard">Your matchup</a>
    </div>
  </main>
  <script>
    // the address that wasn't found, as plain text
    (function () {
      var p = location.pathname + location.search;
      if (p && p !== '/') { document.getElementById('path').textContent = location.host + p; document.getElementById('where').hidden = false; }
    })();
  </script>
</body>
</html>

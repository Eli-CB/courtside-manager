name: Refresh data and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * *' # every day at 11:00 UTC (7 a.m. Eastern)
  workflow_dispatch:
    inputs:
      images:
        description: Rebuild headshots and team logos too
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    # code pushes publish right away; scheduled and manual runs pull fresh data first
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull NBA, ESPN and Fantrax data
        run: python scripts/update_data.py

      - name: Rebuild headshots and logos (1st of the month, new players, or when asked)
        run: |
          # active players with no headshot yet (new signings, call-ups) trigger a rebuild between monthly ones
          missing=$(python -c "import json; p={x['id'] for x in json.load(open('data/players.json', encoding='utf-8'))['players']}; i=set(json.load(open('data/images.json', encoding='utf-8'))['ids']); print(len(p - i))")
          echo "Players without a headshot: $missing"
          if [ "${{ inputs.images }}" = "true" ] || [ "$(date -u +%d)" = "01" ] || [ "$missing" -gt 5 ]; then
            python -m pip install --quiet pillow
            python scripts/build_images.py
          else
            echo "Skipping images today"
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Data unchanged"
          else
            git commit -m "Refresh NBA and league data"
            # a code push can land while this job runs: replay the data on top of it and retry
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase -X theirs origin main
            done
            exit 1
          fi

  deploy:
    needs: refresh
    # publish even if the data pull failed, so the site keeps the last good data
    if: always() && needs.refresh.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

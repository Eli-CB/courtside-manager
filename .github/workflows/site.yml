name: Refresh data and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *' # every day at 08:00 UTC: 4 a.m. Eastern (3 a.m. in winter, as cron has no daylight saving)
  workflow_dispatch:
    inputs:
      images:
        description: Rebuild headshots and team logos too
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  refresh:
    # code pushes publish right away; scheduled and manual runs pull fresh data first
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # each sport runs apart: if one fails, the others still go out, and the last step fails the run so GitHub says so
      - name: Pull NBA, ESPN and Fantrax data
        id: nba
        continue-on-error: true
        run: python scripts/update_data.py

      - name: Rebuild headshots and logos (1st of the month, new players, or when asked)
        run: bash scripts/refresh_images.sh "" "${{ inputs.images }}"

      - name: Pull NHL and ESPN data
        id: nhl
        continue-on-error: true
        run: python scripts/update_nhl.py

      - name: Rebuild NHL headshots and logos (1st of the month, new players, or when asked)
        continue-on-error: true
        run: bash scripts/refresh_images.sh nhl "${{ inputs.images }}"

      - name: Pull NFL data
        id: nfl
        continue-on-error: true
        run: python scripts/update_nfl.py

      - name: Rebuild NFL headshots and logos (1st of the month, new players, or when asked)
        continue-on-error: true
        run: bash scripts/refresh_images.sh nfl "${{ inputs.images }}"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Data unchanged"
          else
            git commit -m "Refresh NBA, NHL, NFL and league data"
            # a code push can land while this job runs: replay the data on top of it and retry
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase -X theirs origin main
            done
            exit 1
          fi

      - name: Fail the run if a sport's data didn't update
        if: steps.nba.outcome == 'failure' || steps.nhl.outcome == 'failure' || steps.nfl.outcome == 'failure'
        run: |
          echo "::error::Data refresh failed. NBA: ${{ steps.nba.outcome }}, NHL: ${{ steps.nhl.outcome }}, NFL: ${{ steps.nfl.outcome }}"
          exit 1

  test:
    # every run tests what's on main now, data runs too: a commit whose own run failed mustn't go out with the next data
    needs: refresh
    if: always() && needs.refresh.result != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/app.test.js
      - run: python3 -m unittest discover -s tests -p "test_*.py"

  deploy:
    needs: [refresh, test]
    # publish even if the data pull failed, so the site keeps the last good data; never code whose tests failed
    if: always() && needs.refresh.result != 'cancelled' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the commit the tests passed on: main may have moved since
          ref: ${{ needs.test.outputs.sha }}
          # the history (no file contents) says when the code last changed
          fetch-depth: 0
          filter: blob:none

      # the last commit that changed the code, not the latest: the daily data commits mustn't make every visitor download it again
      - name: Stamp this version on the page's files, so a refresh fetches the new ones
        run: |
          v="$(git log -1 --format=%h -- index.html styles.css js)"
          sed -i "s/__BUILD__/$v/g" index.html js/*.js
          grep -o "core.js?v=[a-z0-9]*" index.html

      # only what the page reads: not the tests and their fixtures, the scripts, the Worker or the notes (most of the repo's files)
      - name: Gather the site's own files
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest js data fonts icons _site/
          du -sh _site && find _site -type f | wc -l

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

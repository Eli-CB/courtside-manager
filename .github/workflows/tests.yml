name: Tests

# main is tested by the site workflow on every run, before it publishes (site.yml); this covers pull requests
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/app.test.js
      - run: python3 -m unittest discover -s tests -p "test_*.py"
